name: ACM Library Build & PDF Generator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile C++ Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up GCC
        run: sudo apt-get update && sudo apt-get install -y g++
        
      - name: Create CP Dummy Header
        run: |
          cat << "HEADER_EOF" > dummy_cp_header.h
          #include <bits/stdc++.h>
          using namespace std;
          const int N = 2e6+9;
          const int MAXN = 2e6+9;
          const int MOD = 1e9+7;
          const int inf = 1e9;
          const long long INF = 1e18;
          #define int long long
          #define endl "\n"
          struct NTT { void init(){} void multiply(){} };
          struct base { double r, i; base(){} base(double r, double i):r(r),i(i){} };
          HEADER_EOF
          
      - name: Compile check
        run: |
          echo "Compiling all .cpp files to check for syntax errors..."
          find . -name "*.cpp" -type f | while read file; do
            echo "Checking $file"
            g++ -std=c++17 -fsyntax-only -w -include dummy_cp_header.h "$file"
            if [ $? -ne 0 ]; then
              echo "::warning file=$file::Compilation failed for $file. Check missing macros/structs."
            fi
          done
          echo "Compilation check finished."

  generate-pdf:
    name: Generate Reference PDF Notebook
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended
          
      - name: Generate LaTeX file
        run: python scripts/generate_pdf.py
        
      - name: Compile LaTeX to PDF
        run: |
          pdflatex -interaction=nonstopmode notebook.tex || true
          pdflatex -interaction=nonstopmode notebook.tex || true
          
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACM_Reference_Notebook
          path: notebook.pdf
          
      - name: Commit PDF to pdf branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B pdf-release
          git add notebook.pdf -f
          git commit -m "Auto-generated ACM Reference Notebook PDF" || echo "No changes to commit"
          git push -f origin pdf-release
