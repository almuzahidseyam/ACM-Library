name: ACM Library Build & PDF Generator

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile C++ Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up GCC
        run: sudo apt-get update && sudo apt-get install -y g++
        
      - name: Compile check
        run: |
          echo "Compiling all .cpp files to check for syntax errors..."
          find . -name "*.cpp" -type f | while read file; do
            echo "Checking $file"
            # We use -fsyntax-only to compile quickly without generating binaries
            # We ignore warnings (-w) since templates often have unused variables
            g++ -std=c++17 -fsyntax-only -w "$file" || echo "Warning: Compilation failed for $file"
          done
          echo "Compilation check finished."

  generate-pdf:
    name: Generate Reference PDF Notebook
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended
          
      - name: Generate LaTeX file
        run: python scripts/generate_pdf.py
        
      - name: Compile LaTeX to PDF
        run: |
          pdflatex -interaction=nonstopmode notebook.tex || true
          pdflatex -interaction=nonstopmode notebook.tex || true
          
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACM_Reference_Notebook
          path: notebook.pdf
          
      - name: Commit PDF to pdf branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B pdf-release
          git add notebook.pdf -f
          git commit -m "Auto-generated ACM Reference Notebook PDF" || echo "No changes to commit"
          git push -f origin pdf-release
